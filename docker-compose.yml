services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?run scripts/init-env.sh first}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d uas_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
