services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?run scripts/init-env.sh first}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d uas_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-billing:
    build: ./services/mock_billing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BILLING_DATABASE_URL: postgresql+psycopg://billing_app:${BILLING_DB_PASSWORD:?run scripts/init-env.sh first}@db:5432/uas
      BILLING_API_KEY: ${BILLING_API_KEY:?run scripts/init-env.sh first}
      FAULT_INJECTION_ENABLED: "false"
      FAULT_ADMIN_KEY: ${FAULT_ADMIN_KEY:?run scripts/init-env.sh first}
      PERSONAS_PATH: /data/synthetic/personas.json
    volumes:
      - ./data/synthetic:/data/synthetic:ro
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
